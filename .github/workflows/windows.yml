name: Windows build

on:
  push:
    branches: [main, 'codex/windows-**']
    paths: ['src/**', 'build.ps1', 'tests/windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile and test .NET Framework application
        shell: powershell
        run: .\build.ps1 -Test
      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $binary = 'dist/NiuMa-Windows.exe'
          Copy-Item '牛马脱敏器.exe' $binary
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NiuMa-Windows.exe" | Set-Content 'dist/SHA256SUMS.txt' -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: NiuMa-Windows
          path: |
            dist/NiuMa-Windows.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
